<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Rate Widget</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="widget">
      <header class="titlebar">
        <div class="brand">
          <span class="gauge" aria-hidden="true"></span>
          <span>Codex 剩餘用量</span>
        </div>
        <div class="actions">
          <button id="refresh" title="重新整理" type="button">↻</button>
          <button id="hide" title="隱藏到系統列" type="button">×</button>
        </div>
      </header>
      <section id="limits" class="limits" aria-live="polite">
        <div class="empty">讀取中</div>
      </section>
      <footer id="updated" class="updated"></footer>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
